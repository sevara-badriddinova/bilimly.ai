spring.application.name=bilimly-backend
# PostgreSQL connection
spring.datasource.url=jdbc:postgresql://localhost:5432/bilimly
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.datasource.driver-class-name=org.postgresql.Driver

# JPA (Hibernate) config
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Server port
server.port=8080

spring.web.cors.allowed-origins=http://localhost:5174
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true

# JWT Secret (change in production!)
jwt.secret=oN6rbXpuJbGHpJrRcWC8h7C3oMV4mKS0lW0pRaWIZVBkvOf6SMkLwFeYWVXcBKZz5BIrI801k+4xsBbpHlW07w==

# OpenAI Configuration
# Set OPENAI_API_KEY environment variable in IntelliJ Run Configuration
# The environment variable must be set for the application to work
openai.api-key=${OPENAI_API_KEY}
openai.model=gpt-4o-mini
